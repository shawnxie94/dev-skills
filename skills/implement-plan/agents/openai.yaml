interface:
  display_name: "Implement Plan"
  short_description: "Execute an approved batch or DAG assignment"
  default_prompt: "Use $implement-plan only after verifying an approved canonical execution-plan artifact and its source_plan_sha256 linkage; preserve orchestration_mode, execution_target, and execution_backend, then execute the selected whole-goal batch or assigned parallel-DAG node without changing the orchestration strategy. Preserve any user-specified subagent model/provider/runtime/thinking level exactly; if unavailable, report a blocker rather than substituting. A subagent is a leaf executor and must not recursively call or delegate to another subagent."
