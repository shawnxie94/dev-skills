interface:
  display_name: "Execution Delivery"
  short_description: "Assess execution shape, plan, and route delivery"
  default_prompt: "Use $execution-delivery plan mode to assess parallelism first; after the user chooses batch or parallel_dag, generate the approved plan, then use delegate to route it to the current session or a subagent. When the target is a subagent, use $subagent-orchestration to resolve the logical role, current-runtime adapter, context/isolation/output policy, and lifecycle handling. Preserve any user-specified subagent model/provider/runtime/thinking level exactly; if unavailable, tell the user instead of substituting. A subagent is a leaf executor and must not recursively call or delegate to another subagent."
