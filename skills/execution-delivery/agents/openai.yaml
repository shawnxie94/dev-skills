interface:
  display_name: "Execution Delivery"
  short_description: "Assess execution shape, plan, and route delivery"
  default_prompt: "Use $execution-delivery plan mode to assess parallelism first; after the user chooses batch or parallel_dag, generate the approved plan, then use delegate to route it to the current session or a subagent. For a subagent, resolve the execution backend from the current harness: zcode_subagent in a ZCode session (native Agent tool), codex_subagent (or zcode_mcp only when the ZCode MCP bridge tools are exposed in this session), or pi_subagent when the native subagent tool is present in a Pi session. pi_subagent task packets must also declare subagent_name (the agent registry name from ~/.pi/agent/agents/ or .pi/agents/) and subagent_scope (user|project|both). Preserve any user-specified subagent model/provider/runtime/thinking level exactly; if unavailable, tell the user instead of substituting. A subagent is a leaf executor and must not recursively call or delegate to another subagent."
