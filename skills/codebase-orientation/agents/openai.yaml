interface:
  display_name: "Codebase Orientation"
  short_description: "First-pass repository map before code changes"
  default_prompt: "Use $codebase-orientation to map this repository before planning changes. Prefer CodeGraph for first-pass orientation, run/test discovery, entry-point mapping, and current-file verification. If a .codegraph index exists, query codegraph_explore first for architecture and relationship leads, then verify current facts from files and configs."
