interface:
  display_name: "Prototype UI"
  short_description: "Turn a settled PRD into a clickable prototype and UI spec"
  default_prompt: "Use $prototype-ui to run the design-stage workflow from the PRD: define flows, states, visual direction, a clickable prototype, and a UI specification before writing the TRD. Reuse existing tokens when present; otherwise define a prototype-only visual brief. Default to local static output, or select one external provider—huashu-design for visual-first HTML and variants, OpenDesign for connected project-context design work, or Figma for editable design assets—when its advantage is material. Materialize review evidence and the UI spec back into the repository."
